# 开发集 Recall@5 门禁。测试集不参与决策。延迟不进硬门禁，不设绝对 90% 门槛。
# 密钥只从 GitHub Actions secret DASHSCOPE_API_KEY 读取，不得写入仓库。
name: retrieval-recall-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  recall-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: box
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: policy_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U box -d policy_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: policy_qa
      POSTGRES_USER: box
      POSTGRES_PASSWORD: ci
      EMBEDDING_MODEL: text-embedding-v4
      EMBEDDING_DIM: 1024
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Check whether DASHSCOPE_API_KEY secret is present
        id: secret
        run: |
          if [ -z "${DASHSCOPE_API_KEY}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::跳过检索评测：仓库未配置 GitHub Actions secret DASHSCOPE_API_KEY。请在 Settings > Secrets and variables > Actions 中添加同名密钥后重新运行。本工作流不会把密钥写入仓库；缺少密钥时跳过评测，不视为门禁失败。"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build index, evaluate dev, and enforce Recall@5 gate
        if: steps.secret.outputs.present == 'true'
        run: |
          python db/migrate.py
          python scripts/import_corpus.py
          python scripts/chunk_and_embed.py --strategy locked
          python scripts/map_annotations.py
          RETRIEVER=$(python -c "import json; from pathlib import Path; p=json.loads(Path('reports/locked_retrieval.json').read_text()); print(p['retriever'])")
          python scripts/eval_retrieval.py --split dev --retriever "$RETRIEVER" --out reports/ci_current_dev_eval.json
          python scripts/ci_check_recall.py --current reports/ci_current_dev_eval.json --baseline reports/ci_baseline.json
