# 供其他环境用 Docker 部署 Postgres+pgvector 与 Redis。
# 本机当前以本机安装的 Postgres 17 / Redis 8 跑通第一段，不依赖 Docker。
# 启动前请在环境中提供 POSTGRES_PASSWORD，不要把真实密码写入本文件。

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: policy-qa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-policy_qa}
      POSTGRES_USER: ${POSTGRES_USER:-policy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - policy_qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-policy} -d ${POSTGRES_DB:-policy_qa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: policy-qa-redis
    command: ["redis-server", "--bind", "0.0.0.0", "--protected-mode", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - policy_qa_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  policy_qa_pgdata:
  policy_qa_redis:
