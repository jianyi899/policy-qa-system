[project]
name = "policy-qa-system"
version = "0.1.0"
description = "电商售后政策问答系统（第一段地基）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.2.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
  "dashscope>=1.20.0",
  "rank-bm25>=0.2.2",
  "jieba>=0.42.1",
  "langfuse>=2.60.0",
  "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
